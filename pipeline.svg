  <rect x="34" y="80" width="174" height="74" rx="10" fill="#132A3E" stroke="#255A70"/><text x="121" y="124" fill="#E2E8F0" font-size="17" font-weight="bold">INGEST</text>
  <rect x="248" y="80" width="174" height="74" rx="10" fill="#132A3E" stroke="#255A70"/><text x="335" y="124" fill="#E2E8F0" font-size="17" font-weight="bold">ENGINEER</text>
  <rect x="462" y="80" width="174" height="74" rx="10" fill="#132A3E" stroke="#255A70"/><text x="549" y="124" fill="#E2E8F0" font-size="17" font-weight="bold">LEARN</text>
  <rect x="676" y="80" width="174" height="74" rx="10" fill="#132A3E" stroke="#255A70"/><text x="763" y="124" fill="#E2E8F0" font-size="17" font-weight="bold">DEPLOY</text>
  <rect x="890" y="80" width="176" height="74" rx="10" fill="#132A3E" stroke="#255A70"/><text x="978" y="124" fill="#E2E8F0" font-size="17" font-weight="bold">MONITOR</text>
</g>
<g stroke="url(#stroke)" stroke-width="2" opacity=".8"><path d="M208 117h40M422 117h40M636 117h40M850 117h40"/></g>
<g fill="#67E8F9"><circle class="dot" cx="211" cy="117" r="4"/><circle class="dot dot2" cx="211" cy="117" r="4"/><circle class="dot" cx="425" cy="117" r="4"/><circle class="dot dot2" cx="425" cy="117" r="4"/><circle class="dot" cx="639" cy="117" r="4"/><circle class="dot dot2" cx="639" cy="117" r="4"/><circle class="dot" cx="853" cy="117" r="4"/><circle class="dot dot2" cx="853" cy="117" r="4"/></g>
<text x="38" y="186" fill="#7796A9" font-family="Arial" font-size="12">A connected mindset across data platforms, predictive models, and intelligent interfaces.</text>
